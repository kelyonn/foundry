name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler, so a new clippy lint upstream
      # cannot turn CI red without a code change here.
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The tokenizer is small and public, so tokenizer parity runs in CI.
      # The 1 GB checkpoint is not downloaded; tests that need it skip.
      - name: fetch tokenizer.json
        run: |
          mkdir -p models/qwen2.5-0.5b
          curl -fsSL -o models/qwen2.5-0.5b/tokenizer.json \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main/tokenizer.json

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --release
